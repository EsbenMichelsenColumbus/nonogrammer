<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nonograms cover</title>
<!--
  Cover art for the game (1280 x 640, the size GitHub and most sites use for link previews).
  It draws the built-in Lighthouse puzzle half solved, with a hint, straight from js/puzzles.js.
  To regenerate assets/cover.png, run tools/make-cover.ps1.
-->
<style>
  html, body { margin: 0; background: #f6f4ef; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="cover" xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"></svg>
<script src="../js/solver.js"></script>
<script src="../js/puzzles.js"></script>
<script>
(function () {
  'use strict';
  const S = window.NonogramSolver;
  const C = {
    bg: '#f6f4ef', panel: '#ffffff', ink: '#1f2328', muted: '#6b6f76', line: '#d9d6ce', strong: '#4a4d52',
    filled: '#23272e', x: '#a3a7ad', accent: '#2f6fde', accentSoft: '#e3ecfc', hint: '#f4b400', hintSoft: '#fff4d1', done: '#c2c5ca',
  };
  const FONT = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";

  const p = window.NonogramPuzzles.PUZZLES.find(q => q.id.startsWith('lighthouse'));
  const sol = p.rows.map(r => [...r].map(ch => (ch === '#' ? 1 : 0)));
  const h = sol.length, w = sol[0].length;
  const clues = S.cluesFromSolution(sol.map(r => r.map(v => (v ? S.FILLED : S.EMPTY))));

  // ---- the half-solved state: everything below a diagonal is done, the sky to the upper right is not
  const solvedCell = (r, c) => c - r * 0.9 < 3;
  const state = sol.map((row, r) => row.map((v, c) => (solvedCell(r, c) ? (v ? S.FILLED : S.EMPTY) : S.UNKNOWN)));
  // players mark empty squares mostly near the part they are still working on
  const nearOpen = (r, c) => {
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < h && cc >= 0 && cc < w && state[rr][cc] === S.UNKNOWN) return true;
    }
    return false;
  };

  // ---- the hint: the column where line logic now fills the most squares
  let hint = null;
  for (let c = 0; c < w; c++) {
    const line = state.map(row => row[c]);
    const res = S.solveLineExact(clues.cols[c], line);
    const fills = res.cells.filter(x => x.v === S.FILLED).map(x => x.i);
    if (fills.length && (!hint || fills.length > hint.fills.length)) hint = { c, fills };
  }

  // ---- layout
  const maxRow = Math.max(...clues.rows.map(l => l.length));
  const maxCol = Math.max(...clues.cols.map(l => l.length));
  const cell = 17;
  const fs = 10.5;                       // clue font size
  const colH = maxCol * 12 + 8;          // column clue height
  const rowW = maxRow * 13 + 8;          // row clue width
  const pad = 22;
  const panelW = pad * 2 + rowW + w * cell;
  const panelH = pad * 2 + colH + h * cell;
  const px = 56, py = Math.round((640 - panelH) / 2);
  const gx = px + pad + rowW, gy = py + pad + colH;

  const out = [];
  const el = (tag, attrs, inner) => out.push(`<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ')}${inner == null ? '/>' : `>${inner}</${tag}>`}`);

  // background: soft paper with a faint pixel pattern fading in from the right
  out.push(`<defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><rect x="9" y="9" width="6" height="6" rx="1.2" fill="#e7e3d9"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0.45" stop-color="${C.bg}" stop-opacity="1"/><stop offset="1" stop-color="${C.bg}" stop-opacity="0.2"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.10"/></filter>
  </defs>`);
  el('rect', { width: 1280, height: 640, fill: C.bg });
  el('rect', { width: 1280, height: 640, fill: 'url(#dots)' });
  el('rect', { width: 1280, height: 640, fill: 'url(#fade)' });

  // board panel
  el('rect', { x: px, y: py, width: panelW, height: panelH, rx: 14, fill: C.panel, filter: 'url(#shadow)' });

  // hint column highlight (clue + squares)
  if (hint) {
    el('rect', { x: gx + hint.c * cell, y: py + pad - 4, width: cell, height: colH + 4 + h * cell, fill: C.hintSoft });
  }

  // squares
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const x = gx + c * cell, y = gy + r * cell, v = state[r][c];
    if (v === S.FILLED) el('rect', { x: x + 1, y: y + 1, width: cell - 2, height: cell - 2, rx: 2, fill: C.filled });
    else if (v === S.EMPTY && nearOpen(r, c)) {
      const m = cell * 0.3;
      el('path', { d: `M${x + m} ${y + m}L${x + cell - m} ${y + cell - m}M${x + cell - m} ${y + m}L${x + m} ${y + cell - m}`, stroke: C.x, 'stroke-width': 1.3, 'stroke-linecap': 'round' });
    }
  }
  // hint squares: amber outline with a soft fill
  if (hint) hint.fills.forEach(r => {
    const x = gx + hint.c * cell, y = gy + r * cell;
    el('rect', { x: x + 1.5, y: y + 1.5, width: cell - 3, height: cell - 3, rx: 2, fill: C.hint, 'fill-opacity': 0.55, stroke: C.hint, 'stroke-width': 2 });
  });

  // grid lines
  for (let i = 0; i <= w; i++) {
    const strong = i % 5 === 0;
    el('line', { x1: gx + i * cell, y1: gy, x2: gx + i * cell, y2: gy + h * cell, stroke: strong ? C.strong : C.line, 'stroke-width': strong ? 1.6 : 1 });
  }
  for (let i = 0; i <= h; i++) {
    const strong = i % 5 === 0;
    el('line', { x1: gx, y1: gy + i * cell, x2: gx + w * cell, y2: gy + i * cell, stroke: strong ? C.strong : C.line, 'stroke-width': strong ? 1.6 : 1 });
  }

  // clues: a line's numbers grey out once the line is solved
  const txt = (x, y, s, color, anchor) => el('text', { x, y, 'font-size': fs, 'font-weight': 600, fill: color, 'text-anchor': anchor || 'middle', 'font-family': FONT }, s);
  for (let r = 0; r < h; r++) {
    const done = state[r].every(v => v !== S.UNKNOWN);
    const nums = clues.rows[r].length ? clues.rows[r] : [0];
    nums.slice().reverse().forEach((n, k) => txt(gx - 8 - k * 13, gy + r * cell + cell / 2 + fs * 0.36, n, done ? C.done : C.ink, 'end'));
  }
  for (let c = 0; c < w; c++) {
    const done = state.every(row => row[c] !== S.UNKNOWN);
    const nums = clues.cols[c].length ? clues.cols[c] : [0];
    const color = hint && c === hint.c ? C.ink : done ? C.done : C.ink;
    nums.slice().reverse().forEach((n, k) => txt(gx + c * cell + cell / 2, gy - 8 - k * 12, n, color));
  }

  // ---- right-hand side: title, tagline, hint card, features
  const tx = px + panelW + 72;
  const right = 1280 - 64;
  // brand mark (same as the app's: two filled squares on a grey tile)
  const bm = 46, by = 118;
  el('rect', { x: tx, y: by, width: bm, height: bm, rx: 9, fill: '#e4e6ea' });
  el('rect', { x: tx, y: by, width: bm / 2, height: bm / 2, rx: 0, fill: C.filled });
  el('rect', { x: tx + bm / 2, y: by + bm / 2, width: bm / 2, height: bm / 2, fill: C.filled });
  el('rect', { x: tx, y: by, width: bm, height: bm, rx: 9, fill: 'none', stroke: C.filled, 'stroke-width': 0 });
  el('text', { x: tx + bm + 18, y: by + bm - 6, 'font-size': 64, 'font-weight': 800, fill: C.ink, 'font-family': FONT, 'letter-spacing': -1.5 }, 'Nonograms');

  const tag = ['Picture logic puzzles with hints', 'that teach you how to solve them.'];
  tag.forEach((s, i) => el('text', { x: tx, y: 222 + i * 34, 'font-size': 26, fill: C.muted, 'font-family': FONT }, s));

  // hint card
  const cy = 300, cw = right - tx, ch = 112;
  el('rect', { x: tx, y: cy, width: cw, height: ch, rx: 12, fill: C.panel, filter: 'url(#shadow)' });
  el('rect', { x: tx, y: cy, width: 6, height: ch, rx: 3, fill: C.hint });
  el('text', { x: tx + 26, y: cy + 36, 'font-size': 15, 'font-weight': 700, fill: '#9a6b00', 'font-family': FONT, 'letter-spacing': 1.2 }, 'HINT · LINE LOGIC');
  if (hint) {
    el('text', { x: tx + 26, y: cy + 66, 'font-size': 19, fill: C.ink, 'font-family': FONT }, `Column ${hint.c + 1}: however its blocks fit,`);
    el('text', { x: tx + 26, y: cy + 92, 'font-size': 19, fill: C.ink, 'font-family': FONT }, hint.fills.length === 1 ? 'this square is always filled.' : `these ${hint.fills.length} squares are always filled.`);
  }

  // features
  const feats = ['Hand-made puzzles', 'Sizes up to 100 × 100', 'Turn pictures into puzzles', 'Plays on phones'];
  const chipW = (cw - 12) / 2;
  feats.forEach((f, i) => {
    const fx = tx + (i % 2) * (chipW + 12), fy = 450 + Math.floor(i / 2) * 48;
    el('rect', { x: fx, y: fy, width: chipW, height: 38, rx: 19, fill: C.accentSoft });
    el('text', { x: fx + chipW / 2, y: fy + 24.5, 'font-size': 16, 'font-weight': 600, fill: '#1d4fae', 'text-anchor': 'middle', 'font-family': FONT }, f);
  });

  el('text', { x: tx, y: py + panelH - 4, 'font-size': 16, fill: C.muted, 'font-family': FONT }, 'Play free in your browser · esbenmichelsencolumbus.github.io/nonogrammer');

  document.getElementById('cover').innerHTML = out.join('');
})();
</script>
</body>
</html>
